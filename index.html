<title>ألغاز الرواد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Baloo+Bhaijaan+2:wght@800&display=swap">
<style>
/* VOICE: playful, warm, made for 10–13 year olds; one brand palette in both themes
   IDEA: a puzzle booklet from the Ruwwad program; today's page is open, older ones stamped done, next ones sealed
   PICTURE: the journey road of 11 beads that fills with letters as the child orders the Seerah events
   COLOUR and TYPE: Ruwwad blue #4A5AA8 ground, yellow #FFCF63 lead accent, orange #EA5529 and green #66B598 support; IBM Plex Sans Arabic + Baloo Bhaijaan 2 for the masthead
   LAYOUT: masthead, puzzle picker row, then the open puzzle in one column (max 860px) */
:root{color-scheme:dark;--blue:#4A5AA8;--deep:#3A4890;--navy:#1F2A66;--y:#FFCF63;--o:#EA5529;--g:#66B598;--w:#fff}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--blue);color:var(--w);font:17px/1.6 'IBM Plex Sans Arabic',system-ui,sans-serif;overflow-x:clip;
  background-image:radial-gradient(circle at 12% 8%,rgba(255,207,99,.14) 0 2px,transparent 3px),radial-gradient(circle at 88% 22%,rgba(255,255,255,.35) 0 1.5px,transparent 2.5px),radial-gradient(circle at 70% 60%,rgba(255,255,255,.25) 0 1.5px,transparent 2.5px),radial-gradient(circle at 20% 75%,rgba(255,207,99,.18) 0 2px,transparent 3px);background-size:420px 420px,360px 360px,300px 300px,480px 480px}
button{font:inherit;color:inherit;cursor:pointer;border:0}
button:focus-visible{outline:3px solid var(--y);outline-offset:3px}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 0 10px}
.brand{display:flex;align-items:center;gap:12px}
.brand h1{margin:0;font-family:'Baloo Bhaijaan 2','IBM Plex Sans Arabic',sans-serif;font-weight:800;font-size:clamp(30px,6vw,46px);line-height:1.2}
.brand h1 span{color:var(--y)}
header img{width:clamp(78px,16vw,112px);height:auto}
.spark{width:22px;height:22px;flex:none}
/* picker */
.pick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:14px 0 26px}
.tab{position:relative;text-align:right;padding:14px 14px 12px;border-radius:20px;background:rgba(20,28,80,.32);border:2px solid transparent;min-height:112px;display:flex;flex-direction:column;gap:6px;transition:transform .15s}
.tab:hover{transform:translateY(-2px)}
.tab[aria-current=true]{border-color:var(--y);background:rgba(20,28,80,.5)}
.tab b{font-size:18px;line-height:1.35}
.tab small{font-size:14px;opacity:.85;line-height:1.4}
.tag{align-self:flex-start;font-size:13px;font-weight:700;padding:2px 10px;border-radius:999px}
.t-today{background:var(--y);color:var(--navy)}.t-done{background:var(--g);color:var(--navy)}.t-soon{background:rgba(255,255,255,.16)}
.tab.locked{opacity:.75}
.tab .lock{position:absolute;left:12px;top:12px;width:22px;height:22px;opacity:.8}
@media(max-width:640px){.pick{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* panel */
.panel{background:rgba(20,28,80,.28);border-radius:28px;padding:clamp(18px,4vw,34px)}
.ptitle{margin:0;font-size:clamp(34px,7vw,52px);line-height:1.15;color:var(--y);text-wrap:balance}
.lead{margin:8px 0 18px;font-size:17px;opacity:.95}
.lead b{color:var(--y)}
.sec{margin:22px 0 10px;font-size:16px;font-weight:700;color:var(--y)}
/* events */
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media(max-width:640px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ev{display:flex;align-items:center;gap:10px;min-height:64px;padding:8px 10px;border-radius:16px;background:#fff;color:var(--navy);text-align:right;font-weight:700;font-size:15px;line-height:1.35;transition:opacity .2s,transform .15s}
.ev:active{transform:scale(.97)}
.ev .seal{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:22px;font-weight:700}
.ev.used{opacity:.28;pointer-events:none}
/* road */
.road{position:relative;display:flex;flex-wrap:wrap;gap:12px 8px;justify-content:flex-start;padding:16px 12px;border-radius:22px;background:rgba(20,28,80,.4);border:2px dashed rgba(255,207,99,.5)}
.bead{display:flex;flex-direction:column;align-items:center;gap:2px}
.bead button{width:48px;height:48px;border-radius:50%;border:3px dashed var(--y);background:transparent;font-size:24px;font-weight:700;display:grid;place-items:center}
.bead button.full{border-style:solid;background:var(--y);color:var(--navy)}
.bead button.ok{background:var(--g);border-color:var(--g);color:#fff}
.bead button.bad{background:var(--o);border-color:var(--o);color:#fff}
.bead span{font-size:13px;opacity:.75}
.ends{display:flex;justify-content:space-between;font-size:14px;font-weight:700;color:var(--y);margin:0 4px 6px}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.btn{min-height:46px;padding:0 20px;border-radius:999px;font-weight:700;font-size:16px;background:rgba(255,255,255,.14)}
.btn.main{background:var(--y);color:var(--navy)}
.btn:disabled{opacity:.4;cursor:default}
.msg{margin-top:14px;padding:12px 16px;border-radius:16px;font-weight:600;display:none}
.msg.show{display:block}
.msg.warn{background:rgba(234,85,41,.22);border:2px solid rgba(255,140,120,.55);color:#FFD2C8}
.msg.hint{background:rgba(255,207,99,.16);border:2px solid rgba(255,207,99,.5)}
.win{display:none;margin-top:20px;text-align:center;padding:22px 16px;border-radius:24px;background:rgba(20,28,80,.45);border:3px solid var(--y)}
.win.show{display:block;animation:pop .45s ease-out}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.big{margin:4px 0;font-size:clamp(40px,9vw,64px);font-weight:700;line-height:1.2;color:var(--y)}
.q2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.opt{min-height:52px;border-radius:16px;background:#fff;color:var(--navy);font-weight:700;font-size:18px}
.opt.ok{background:var(--g);color:#fff}.opt.bad{background:var(--o);color:#fff;opacity:.85}
.ayah{display:none;margin-top:14px;font-size:20px;line-height:1.8}
.ayah.show{display:block}
/* done puzzle */
.done-stamp{display:inline-block;margin-bottom:10px;padding:4px 16px;border-radius:999px;background:var(--g);color:var(--navy);font-weight:700}
.ws{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}
@media(max-width:640px){.ws{grid-template-columns:minmax(0,1fr)}}
.grid6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;padding:12px;border-radius:22px;background:#fff}
.grid6 div{aspect-ratio:1;border-radius:12px;display:grid;place-items:center;font-size:clamp(20px,5vw,30px);font-weight:700;color:#fff}
.grid6 div.free{background:#E6E8F3;color:var(--navy)}
.hl{display:flex;flex-direction:column;gap:6px}
.hl p{margin:0;padding:8px 12px;border-radius:14px;background:rgba(20,28,80,.4);font-size:15px;display:flex;justify-content:space-between;gap:8px;border-inline-start:6px solid}
.hl p b{color:var(--y);white-space:nowrap}
/* locked */
.sealed{text-align:center;padding:34px 10px}
.sealed svg{width:96px;height:96px}
.sealed h2{margin:10px 0 4px;font-size:clamp(30px,6vw,42px);color:var(--y)}
footer{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:22px;color:var(--y);font-weight:600;font-size:15px}
footer img{width:34px;height:auto;opacity:.9}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  </div>`;
  drawCards();drawRoad();
  document.getElementById('undo').onclick=()=>{if(solved)return;placed.pop();clearMsg();drawCards();drawRoad()};
  document.getElementById('reset').onclick=()=>{placed=[];solved=false;clearMsg();document.getElementById('win').classList.remove('show');drawCards();drawRoad()};
  document.getElementById('hint').onclick=()=>say('hint','تلميح: أول حدث هو مولد النبي ﷺ، وآخر حدث هو حجة الوداع.');
  document.getElementById('check').onclick=check;
  if(solved)showWin();
}
function drawCards(){
  document.getElementById('cards').innerHTML=SHUF.map((k,i)=>`<button class="ev ${placed.includes(k)?'used':''}" data-k="${k}"><span class="seal" style="background:${SEAL[i%3]}">${EV[k][1]}</span>${EV[k][0]}</button>`).join('');
}
function drawRoad(marks){
  document.getElementById('road').innerHTML=Array.from({length:11},(_,i)=>{
    const k=placed[i];const full=k!==undefined;const m=marks?(marks[i]?' ok':' bad'):'';
    return `<div class="bead"><button class="${full?'full':''}${full?m:''}" data-i="${i}" aria-label="الموضع ${AR(i+1)}${full?': '+EV[k][0]:''}">${full?EV[k][1]:''}</button><span>${AR(i+1)}</span></div>`}).join('');
  document.getElementById('check').disabled=placed.length<11||solved;
}
function say(cls,t){const m=document.getElementById('msg');m.className='msg show '+cls;m.textContent=t}
function clearMsg(){const m=document.getElementById('msg');if(m)m.className='msg'}
function check(){
  const marks=placed.map((k,i)=>k===i);const ok=marks.filter(Boolean).length;
  drawRoad(marks);
  if(ok===11){solved=true;clearMsg();showWin();document.getElementById('check').disabled=true}
  else say('warn',`${AR(ok)} من ١١ في مكانها الصحيح… الأخضر صحيح والبرتقالي يحتاج تعديل. اضغط على الحرف لتزيله وحاول مرة ثانية!`);
}
function showWin(){
  const w=document.getElementById('win');w.classList.add('show');
  const opts=['آل عمران','الأحزاب','الفتح','محمد'];
  document.getElementById('q2').innerHTML=opts.map(o=>`<button class="opt" data-o="${o}">سورة ${o}</button>`).join('');
  w.scrollIntoView({behavior:'smooth',block:'center'});
}

function anbiya(){
  const G=[["ي","م","ع","ي","س","ى"],["و","د","و","خ","ل","ص"],["س","ي","ا","س","ل","ا"],["ف","ا","ل","و","ى","ل"],["ي","و","ن","س","د","ح"],["ل","ه","ش","ع","ي","ب"]];
  const PL={"صالح":[[1,5],[2,5],[3,5],[4,5]],"يونس":[[4,0],[4,1],[4,2],[4,3]],"موسى":[[0,1],[1,2],[2,3],[3,4]],"عيسى":[[0,2],[0,3],[0,4],[0,5]],"يوسف":[[0,0],[1,0],[2,0],[3,0]],"داود":[[1,1],[2,2],[3,3],[4,4]],"شعيب":[[5,2],[5,3],[5,4],[5,5]]};
  const COL={'صالح':'#3A8C6E','يونس':'#EA5529','موسى':'#4A5AA8','عيسى':'#F08A6A','يوسف':'#66B598','داود':'#7E8AD0','شعيب':'#2E3A78'};
  const HINT=[['ابتلعه الحوت','يونس'],['كلّمه الله تكليماً','موسى'],['أُرسل إلى قوم ثمود','صالح'],['أُلقي في الجُبّ','يوسف'],['ألان الله له الحديد','داود'],['أُرسل إلى أهل مدين','شعيب'],['تكلّم في المهد','عيسى']];
  const cell={};for(const w in PL)for(const [r,c] of PL[w])cell[r+','+c]=COL[w];
  const grid=G.flatMap((row,r)=>row.map((ch,c)=>{const col=cell[r+','+c];return col?`<div style="background:${col}">${ch}</div>`:`<div class="free">${ch}</div>`})).join('');
  panel.innerHTML=`<span class="done-stamp">تم ✓ — هذا هو الحل</span>
  <h2 class="ptitle">أسماء الأنبياء</h2>
  <p class="lead">انتهى وقت هذا اللغز، وهذه إجابته: كل اسم بلون، والحروف الرمادية كانت أفخاخاً.</p>
  <div class="ws"><div class="grid6">${grid}</div>
  <div class="hl">${HINT.map((h,i)=>`<p style="border-color:${COL[h[1]]}"><span>${AR(i+1)}. ${h[0]}</span><b>${h[1]}</b></p>`).join('')}</div></div>
`;
}

function soon(p){
  panel.innerHTML=`<div class="sealed"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2" fill="#FFCF63"/><path d="M8 11V8a4 4 0 0 1 8 0v3" fill="none" stroke="#FFCF63" stroke-width="2"/></svg>
  <h2>${p.title}</h2><p class="lead">${p.sub}</p><p style="font-weight:700;font-size:20px">سيُفتح قريباً… كونوا قريبين من القناة!</p></div>`;
}

function show(id){
  const p=PUZ.find(x=>x.id===id)||PUZ.find(x=>x.kind==='today');
  renderPick(p.id);
  if(p.kind==='today')today();else if(p.kind==='done')anbiya();else soon(p);
  foot.textContent=p.kind==='today'?'أسرع في الحل، غيرك قارب على الانتهاء!':'كونوا قريبين من القناة… سيكون هناك تحديات مميزة أخرى قريــباً';
  try{if(location.hash.slice(1)!==p.id)history.replaceState(null,'','#'+p.id)}catch(e){}
}

pick.addEventListener('click',e=>{const b=e.target.closest('.tab');if(b)show(b.dataset.id)});
panel.addEventListener('click',e=>{
  const ev=e.target.closest('.ev');
  if(ev&&!solved&&placed.length<11){placed.push(+ev.dataset.k);clearMsg();drawCards();drawRoad();return}
  const bd=e.target.closest('.bead button');
  if(bd&&!solved){const i=+bd.dataset.i;if(placed[i]!==undefined){placed.splice(i,1);clearMsg();drawCards();drawRoad()}return}
  const o=e.target.closest('.opt');
  if(o){const right=o.dataset.o==='الأحزاب';o.classList.add(right?'ok':'bad');if(right){document.querySelectorAll('.opt').forEach(x=>x.disabled=true);document.getElementById('ayah').classList.add('show')}}
});
window.addEventListener('hashchange',()=>show(location.hash.slice(1)));
show(location.hash.slice(1)||'today');
}
</script>
